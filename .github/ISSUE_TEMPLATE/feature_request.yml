name: Feature request
description: Suggest an improvement to Stash.
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Include alternatives or a concrete example if helpful.
    validations:
      required: true
