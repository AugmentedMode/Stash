name: Feature request
description: Suggest an improvement to Stash.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Want to talk an idea through first? Start a thread in [Ideas](https://github.com/AugmentedMode/Stash/discussions/categories/ideas).
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe what you were trying to do when you wished Stash could do this.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Include alternatives or a concrete example if helpful.
    validations:
      required: true
  - type: input
    id: current
    attributes:
      label: What do you use for this today?
      description: Optional. Another clipboard manager, a workaround, or nothing.
